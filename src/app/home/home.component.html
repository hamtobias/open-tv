<ng-keyboard-shortcuts [shortcuts]="shortcuts"></ng-keyboard-shortcuts>
<ng-keyboard-shortcuts-help [key]="'f1'" [closeKey]="'escape'" [title]="'Help'" />

<div class="shell">
  <app-sidebar [active]="filters?.view_type ?? viewModeEnum.All" [showGuide]="anyXtream()"
    (view)="switchMode($event)" (guide)="openGuide()" (settings)="openSettings()"></app-sidebar>

  <div class="main">
    <!-- ======= Top bar: search, media filters, tools ======= -->
    <header class="topbar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path
            d="M9.5 3a6.5 6.5 0 0 1 5.16 10.45l5.45 5.44-1.42 1.42-5.44-5.45A6.5 6.5 0 1 1 9.5 3zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z" />
        </svg>
        <input autocomplete="off" type="text" id="search" #search class="search-input"
          [placeholder]="searchPlaceholder()" />
        <kbd class="search-kbd">Ctrl F</kbd>
      </div>
      <button type="button" class="icon-btn" [class.on]="filters?.use_keywords" (click)="toggleKeywords()"
        [ngbTooltip]="filters?.use_keywords ? 'Keyword search: on' : 'Keyword search: off'" placement="bottom">
        <svg viewBox="0 0 24 24">
          <path
            d="M5.5 7A1.5 1.5 0 1 1 7 5.5 1.5 1.5 0 0 1 5.5 7m15.91 4.58-9-9A2 2 0 0 0 11 2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 .59 1.42l9 9A2 2 0 0 0 13 22a2 2 0 0 0 1.41-.59l7-7A2 2 0 0 0 22 13a2 2 0 0 0-.59-1.42" />
        </svg>
      </button>

      <div class="chips" *ngIf="filtersVisible()">
        <button type="button" id="filter-0" class="chip" [class.on]="chkLiveStream"
          (click)="toggleMedia(mediaTypeEnum.livestream)">
          <span class="dot live"></span> Live
        </button>
        <button type="button" id="filter-1" class="chip" [class.on]="chkMovie" (click)="toggleMedia(mediaTypeEnum.movie)">
          {{ anyXtream() ? "Movies" : "Movies & Series" }}
        </button>
        <button *ngIf="anyXtream()" type="button" id="filter-2" class="chip" [class.on]="chkSerie"
          (click)="toggleMedia(mediaTypeEnum.serie)">
          Series
        </button>
      </div>

      <div class="topbar-tools">
        <button type="button" class="icon-btn" (click)="reload()" ngbTooltip="Reload" placement="bottom">
          <svg viewBox="0 0 24 24">
            <path
              d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z" />
          </svg>
        </button>
        <app-sort-button></app-sort-button>
        <button type="button" class="icon-btn" [matMenuTriggerFor]="bulkMenu"
          [class.disabled]="filters?.series_id && !filters?.season" ngbTooltip="Bulk actions" placement="bottom">
          <svg viewBox="0 0 24 24">
            <path d="M3 5h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zm-4 6h2v2H3zm4 0h14v2H7z" />
          </svg>
        </button>
        <mat-menu #bulkMenu="matMenu">
          <button mat-menu-item (click)="bulkAction(bulkActionType.Hide)">Hide all</button>
          <button mat-menu-item (click)="bulkAction(bulkActionType.Unhide)">Unhide all</button>
          <button mat-menu-item (click)="bulkAction(bulkActionType.Favorite)"
            [disabled]="filters?.view_type == viewModeEnum.Categories && !filters?.group_id">Favorite all</button>
          <button mat-menu-item (click)="bulkAction(bulkActionType.Unfavorite)"
            [disabled]="filters?.view_type == viewModeEnum.Categories && !filters?.group_id">Unfavorite all</button>
        </mat-menu>
      </div>
    </header>

    <div class="content" [class.with-rail]="showRail()">
      <!-- ======= Category rail (Categories view) ======= -->
      <nav class="rail" *ngIf="showRail()">
        <div class="rail-search">
          <input type="text" class="form-control form-control-sm" placeholder="Filter categories…"
            [(ngModel)]="railQuery" />
        </div>
        <div class="rail-list">
          <button type="button" class="rail-item" [class.active]="!filters?.group_id" (click)="selectCategory()">
            <span>All categories</span>
            <small>{{ groups.length }}</small>
          </button>
          <button type="button" *ngFor="let g of filteredGroups(); trackBy: trackById" class="rail-item"
            [class.active]="filters?.group_id == g.id" (click)="selectCategory(g)" [attr.title]="g.name">
            <span>{{ g.name }}</span>
          </button>
          <div class="rail-loading" *ngIf="groupsLoading"><div class="spinner"></div></div>
        </div>
      </nav>

      <section class="library">
        <!-- ======= Page heading / breadcrumb ======= -->
        <div class="page-head">
          <button type="button" class="icon-btn" *ngIf="canGoBack()" (click)="goBack()" ngbTooltip="Back (Esc)">
            <svg viewBox="0 0 24 24">
              <path d="M20 11v2H8l5.5 5.5-1.42 1.42L4.16 12l7.92-7.92L13.5 5.5 8 11z" />
            </svg>
          </button>
          <div class="page-titles">
            <div class="crumbs" *ngIf="crumbs().length > 1">
              <ng-container *ngFor="let c of crumbs(); let last = last">
                <span [class.current]="last">{{ c }}</span>
                <span class="sep" *ngIf="!last">/</span>
              </ng-container>
            </div>
            <h1>{{ pageTitle() }}</h1>
          </div>
        </div>

        <div class="tile-grid" [@fade]="channelsVisible ? 'visible' : 'hidden'">
          <app-channel-tile [attr.id]="i == 0 ? 'first' : null"
            *ngFor="let channel of channels; let i = index; trackBy: trackById" [id]="i" [channel]="channel"
            [viewMode]="viewType"></app-channel-tile>
        </div>

        <div class="empty-state" *ngIf="!loading && channels.length == 0">
          <svg viewBox="0 0 24 24">
            <path
              d="M9.5 3a6.5 6.5 0 0 1 5.16 10.45l5.45 5.44-1.42 1.42-5.44-5.45A6.5 6.5 0 1 1 9.5 3zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z" />
          </svg>
          <h5>Nothing here</h5>
          <p>{{ emptyHint() }}</p>
        </div>

        <button [@fade]="channelsVisible ? 'visible' : 'hidden'" *ngIf="reachedMax === false && channels.length > 0"
          (click)="loadMore()" class="btn btn-outline-primary mx-auto d-block my-4">
          Load more
        </button>
      </section>
    </div>
  </div>
</div>

<button type="button" *ngIf="showScrollTop" (click)="scrollToTop()" class="scroll-to-top" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24">
    <path fill="currentColor" d="M7.41,15.41L12,10.83L16.59,15.41L18,14L12,8L6,14L7.41,15.41Z" />
  </svg>
</button>
